services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sea-to-summit-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: seatosummit
      DB_USER: seatosummit
      DB_PASS: seatosummit_password
    ports:
      - "8080:80"
    restart: unless-stopped

  db:
    image: mysql:8.4
    container_name: sea-to-summit-db
    environment:
      MYSQL_DATABASE: seatosummit
      MYSQL_USER: seatosummit
      MYSQL_PASSWORD: seatosummit_password
      MYSQL_ROOT_PASSWORD: root_password_change_me
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db.sql:/docker-entrypoint-initdb.d/01-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  mysql_data: